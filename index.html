#landing{min-height:100%;transition:opacity .22s ease}
#landing.leaving{opacity:0}
.lp-wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:32px}
.lp-frame{border-radius:20px;border:1px solid var(--line);background:var(--panel);box-shadow:0 1px 2px rgba(36,26,69,.05),0 40px 80px -44px rgba(36,26,69,.32);user-select:none}

/* ---------- Nav: understand → try ---------- */
.lp-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid transparent;transition:background .25s,border-color .25s}
.lp-nav.scrolled{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.lp-nav-in{display:flex;align-items:center;gap:14px;height:76px;transition:height .25s}
.lp-nav.scrolled .lp-nav-in{height:62px}
.lp-nav .brand{padding:0}
.lp-links{margin-left:auto;display:flex;align-items:center;gap:8px}
.lp-link{border:0;background:none;color:var(--ink-2);font-weight:500;font-size:14.5px;padding:8px 12px;border-radius:9px;transition:color .15s,background .15s}
.lp-link:hover{color:var(--ink);background:var(--sunken)}

/* ---------- 1 · Hero: what is Latch? ---------- */
.lp-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;align-items:center;padding-block:36px 104px}
.lp-chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--ink-2)}
.lp-chip i{width:18px;height:18px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 3px var(--lavender)}
.lp-hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,4.6vw,62px);line-height:1.02;letter-spacing:-.028em;margin:22px 0 18px;text-wrap:balance}
.lp-hero h1 span{display:block}
.lp-lede{margin:0;font-size:18.5px;line-height:1.55;color:var(--ink-2);max-width:40ch}
.lp-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.lp-fine{display:flex;align-items:center;gap:9px;margin:20px 0 0;font-size:12.5px;color:var(--muted)}

/* Hero preview: the real resolve-blocker drawer, cycling Documentation → Review → Submission */
.hv{overflow:hidden}
.hv-top{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.hv-top h3{margin:4px 0 0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.hv-top .pill{margin-left:auto}
.hv-phases{list-style:none;margin:16px 20px 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hv-phases button{display:flex;align-items:center;gap:9px;width:100%;padding:0 0 12px;border:0;background:none;text-align:left;font:inherit;color:var(--muted);cursor:pointer}
.hv-phases .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;border:1.5px solid var(--line);color:var(--muted);background:var(--panel);transition:all .3s}
.hv-phases b{font-size:13.5px;font-weight:600;transition:color .3s}
.hv-phases .done .n{border-color:transparent;background:var(--purple);color:#fff}
.hv-phases .done b{color:var(--ink-2)}
.hv-phases .cur .n{border:1.5px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;color:var(--purple)}
.hv-phases .cur b{color:var(--ink)}
.hv-track{height:3px;margin:0 20px;border-radius:3px;background:var(--line-2);overflow:hidden}
.hv-track i{display:block;height:100%;width:33.33%;border-radius:3px;background:var(--grad);transition:width .6s cubic-bezier(.4,0,.2,1)}
.hv-body{display:grid;padding:18px 20px 20px;pointer-events:none}
.hv-pane{grid-area:1/1;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease;visibility:hidden}
.hv-pane.on{opacity:1;transform:none;visibility:visible}
.hv-pane .paper{padding:14px 16px 16px}
.hv-pane .paper .ln{height:5px;margin:6px 0}
.hv-pane .row{display:flex;flex-wrap:wrap;gap:8px}
.hv-pane .cf h3{font-size:16px}
.hv-pane .cf-to{padding:10px 12px;font-size:13.5px}
.hv-pane .packet li{padding:9px 12px;font-size:13.5px}
.hv-pane .share-list li{font-size:13.5px}
.hv .hv-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.hv .hv-foot svg.i{width:14px;height:14px;color:var(--purple)}

/* ---------- Sections ---------- */
.lp-sec{padding-block:104px;border-top:1px solid var(--line-2);scroll-margin-top:62px}
.lp-head{max-width:660px;margin-bottom:56px}
.lp-head h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.3vw,44px);line-height:1.06;letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
.lp-head p{margin:0;font-size:17.5px;line-height:1.55;color:var(--ink-2)}

/* ---------- 2 · How it works: one workflow, four stages ---------- */
.lp-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px}
.lp-step{position:relative;padding-top:4px}
.lp-step:not(:last-child)::before,.lp-step:not(:last-child)::after{content:"";position:absolute;left:60px;right:-16px;top:27px;height:3px;border-radius:3px}
.lp-step:not(:last-child)::before{background:var(--line-2)}
.lp-step:not(:last-child)::after{background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.lp-flow.on .lp-step::after{transform:scaleX(1)}
.lp-flow.on .lp-step:nth-child(2)::after{transition-delay:.6s}
.lp-flow.on .lp-step:nth-child(3)::after{transition-delay:1.2s}
.lp-node{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--muted);border:2px solid var(--line);background:var(--panel);transition:color .4s,box-shadow .4s,border-color .4s}
.lp-flow.on .lp-node{color:var(--purple);border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;box-shadow:0 0 0 5px var(--lavender)}
.lp-flow.on .lp-step:nth-child(2) .lp-node{transition-delay:.6s}
.lp-flow.on .lp-step:nth-child(3) .lp-node{transition-delay:1.2s}
.lp-flow.on .lp-step:nth-child(4) .lp-node{transition-delay:1.8s}
.lp-step h3{margin:22px 0 8px;font-size:19px;font-weight:650;letter-spacing:-.012em;line-height:1.25}
.lp-step p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2);max-width:26ch}
.lp-step .act{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:#fff;background:var(--purple);box-shadow:0 6px 14px -8px rgba(109,74,255,.7);pointer-events:none}
.lp-step .act svg.i{width:13px;height:13px}

/* ---------- 3 · See Latch in action ---------- */
.lp-app{padding:14px;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:22px 22px;pointer-events:none}
.lp-app .bar-top{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-size:12.5px;color:var(--muted);min-width:0}
.lp-app .bar-top b{color:var(--ink);font-weight:600}
.lp-app .bar-top .sp{flex:1}
.lp-app .sandbox,.lp-app .clock{height:30px;font-size:10.5px;padding:0 10px}
.lp-app-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:start}
.lp-app .xj{padding:14px 16px 18px}
.lp-app .xs .hd{cursor:default;padding:10px 12px}
.lp-app .xs .hd b{font-size:14px}
.lp-app .xs .hd span.sub{font-size:12px}
.lp-detail .p-body{display:flex;flex-direction:column;gap:16px;padding-top:20px}
.lp-detail .fields{padding:0;gap:14px 14px}
.lp-detail .fields > div{padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2)}
.lp-detail .cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:0}
.lp-detail .cta .demo-note{margin:0}
/* Callouts: small tags pinned to the real UI */
[data-co]{position:relative}
.co{position:absolute;z-index:2;top:-11px;right:10px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--deep);white-space:nowrap;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 4px 12px -6px rgba(109,74,255,.45);opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease}
.co i{width:6px;height:6px;border-radius:50%;background:var(--grad)}
.lp-app .xs .co{right:auto;left:12px}
.lp-app.on .co{opacity:1;transform:none}
.lp-app.on [data-co="2"] > .co{transition-delay:.15s}
.lp-app.on [data-co="3"] > .co{transition-delay:.3s}
.lp-app.on [data-co="4"] > .co{transition-delay:.45s}
.lp-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;margin-top:26px}
.lp-legend div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.lp-legend b{display:block;color:var(--ink);font-weight:650;font-size:14.5px}
.lp-legend i{flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--grad)}

/* ---------- 4 · Try Latch ---------- */
.lp-final{padding-block:8px 104px}
.lp-final-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;min-height:420px;padding:64px 56px;border-radius:24px;color:#fff;
  /* photo sits on the right; the overlay is solid deep purple behind the text (white text ≈ 14:1) and clears over the people */
  background:
    linear-gradient(90deg,#241A45 0%,rgba(36,26,69,.97) 34%,rgba(36,26,69,.6) 50%,rgba(36,26,69,.14) 72%,rgba(36,26,69,.06) 100%),
    linear-gradient(135deg,rgba(109,74,255,.16),rgba(230,91,190,.1)),
    var(--cta-photo) right 32%/auto 128% no-repeat,
    var(--deep)}
.lp-final-copy{display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:460px}
#landing .lp-final-card h2{color:#fff}
#landing .lp-final-card p{color:rgba(255,255,255,.88)}
#landing .lp-final-card .fine{color:rgba(255,255,255,.7)}
#landing .lp-final-card .btn.go{background:#fff;color:var(--deep);box-shadow:0 10px 24px -12px rgba(0,0,0,.55)}
#landing .lp-final-card .btn.go:hover{background:var(--lavender)}
.lp-final h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.3vw,44px);line-height:1.06;letter-spacing:-.022em;margin:0;text-wrap:balance}
.lp-final p{margin:0 0 10px;font-size:17.5px;color:var(--ink-2);max-width:46ch}
.lp-final .fine{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.lp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:24px 40px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@media (hover:hover){ .hv-phases button:hover b{color:var(--ink)} }
@media (max-width:1024px){
  .lp-hero{grid-template-columns:1fr;gap:48px;padding-block:28px 72px}
  .lp-app-grid{grid-template-columns:1fr}
  .lp-legend{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .lp-flow{grid-template-columns:1fr;gap:34px}
  .lp-step{padding:0 0 0 72px;min-height:48px}
  .lp-node{position:absolute;left:0;top:0}
  .lp-step:not(:last-child)::before,.lp-step:not(:last-child)::after{left:23px;right:auto;top:58px;bottom:-26px;width:3px;height:auto}
  .lp-step:not(:last-child)::after{background:var(--grad-v);transform:scaleY(0);transform-origin:top}
  .lp-flow.on .lp-step::after{transform:scaleY(1)}
  .lp-step h3{margin-top:10px}
  .lp-step p{max-width:none}
  .lp-final-card{min-height:0;padding:200px 28px 36px;background:linear-gradient(180deg,rgba(36,26,69,.15) 0%,rgba(36,26,69,.7) 42%,rgba(36,26,69,.95) 70%),linear-gradient(135deg,rgba(109,74,255,.28),rgba(230,91,190,.18)),var(--cta-photo) 62% 18%/cover no-repeat,var(--deep)}
}
@media (max-width:560px){
  .lp-wrap{padding-inline:16px}
  .lp-link{display:none}
  .lp-nav .brand-name{display:block;font-size:21px}
  .lp-sec{padding-block:72px}
  .lp-head{margin-bottom:40px}
  .lp-lede{font-size:16.5px}
  .lp-ctas .btn{flex:1 1 auto}
  .hv-top{padding:16px 16px 0}
  .hv-phases{margin:14px 16px 0;gap:6px}
  .hv-phases button{flex-direction:column;align-items:flex-start;gap:6px}
  .hv-phases b{font-size:12px}
  .hv-track{margin:0 16px}
  .hv-body{padding:16px}
  .lp-app{padding:10px}
  .lp-app .bar-top .clock,.lp-app .bar-top .crumbs{display:none}
  .lp-detail .fields{grid-template-columns:1fr}
  .lp-legend{grid-template-columns:1fr}
  .lp-final-card{padding:180px 20px 32px}
}
@media (prefers-reduced-motion:reduce){ .co{opacity:1;transform:none} }

/* Landing section nav: hover + selected (scroll-spy) states */
.lp-sections{margin:0 auto;display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--panel) 72%,transparent)}
.lp-sections a{position:relative;display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap;transition:color .15s,background .15s,box-shadow .15s}
.lp-sections a:hover{color:var(--ink);background:var(--sunken)}
.lp-sections a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.lp-sections a[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--panel);box-shadow:0 1px 2px rgba(36,26,69,.08),inset 0 0 0 1px var(--line)}
.lp-sections a[aria-current="true"]::after{content:"";position:absolute;left:50%;width:22px;transform:translateX(-50%);bottom:4px;height:2px;border-radius:2px;background:var(--grad,linear-gradient(90deg,#6D4AFF,#E65BBE))}
.lp-sections a[aria-current="true"]:hover{background:var(--panel)}
.lp-links{margin-left:0}
#inicio,#probar{scroll-margin-top:84px}
/* Hamburger (≤860px): sections, language and CTA move into a dropdown */
.lp-menu{display:contents}
.lp-burger{display:none}
@media (max-width:860px){
  .lp-burger{display:grid;place-items:center;margin-left:auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .lp-burger svg.i{width:20px;height:20px}
  .lp-burger:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .lp-nav.open{background:var(--bg);border-bottom-color:var(--line)}
  .lp-menu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:14px;padding:12px 16px 18px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 24px 40px -24px rgba(36,26,69,.35)}
  .lp-nav.open .lp-menu{display:flex;animation:lpDrop .2s ease both}
  .lp-sections{flex-direction:column;align-items:stretch;width:100%;margin:0;padding:6px;gap:2px}
  .lp-sections a{height:46px;padding:0 14px;font-size:15.5px;justify-content:flex-start}
  .lp-sections a[aria-current="true"]::after{left:auto;right:14px;top:50%;bottom:auto;width:7px;height:7px;border-radius:50%;transform:translateY(-50%)}
  .lp-links{margin:0;display:flex;align-items:center;gap:12px;width:100%}
  .lp-links .seg-toggle button{height:40px;min-width:48px}
  .lp-links .btn{flex:1;height:44px;justify-content:center}
  .lp-sec,#inicio,#probar{scroll-margin-top:72px}
}
@keyframes lpDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .lp-nav.open .lp-menu{animation:none} }

.lp-signup{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:inherit;font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;opacity:.92}
.lp-signup:hover{opacity:1;text-decoration-thickness:2px}
.lp-signup svg.i{width:16px;height:16px}
/* Landing product frame = a still of the real "Hoy" screen */
.lp-mini{display:grid;grid-template-columns:150px minmax(0,1fr);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:22px 22px}
.lp-mside{display:flex;flex-direction:column;gap:18px;padding:18px 10px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.lp-mbrand{display:flex;align-items:center;gap:8px;padding:0 6px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.lp-mini .x-nav button{font-size:13.5px;padding:8px 10px;cursor:default}
.lp-mmain{padding:22px 26px 26px;min-width:0;overflow:visible}
.lp-mini .x-hello{font-size:13px;margin:0 0 2px}
.lp-mtitle{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.05;margin:0 0 16px;color:var(--ink)}
.lp-mini .x-now{position:relative;padding:20px 22px 18px;border-radius:18px}
.lp-mini .x-now .lp-mh{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.12;letter-spacing:-.02em;margin:10px 0 8px;max-width:26ch;color:var(--ink)}
.lp-mini .x-now .lp-mp{margin:0;color:var(--ink-2);font-size:13.5px;max-width:56ch}
.lp-mini .x-why{position:relative;margin-top:12px;padding:10px 12px;font-size:13px}
.lp-mini .x-acts{margin-top:14px}
.lp-mini .x-btn{height:40px;padding:0 16px;font-size:13.5px}
.lp-mini .x-fine{position:relative}
.lp-mini .x-sec{position:relative;margin-top:24px}
.lp-mini .x-sech h3{font-size:15px}
.lp-mini .x-track{padding:16px 18px}
.lp-mini .x-track b{font-size:13px;margin-top:9px}
.lp-mini .x-track li>span:last-child{font-size:12px}
.lp-mini .co{top:-12px}
.lp-mini .x-fine .co{top:-26px;right:0}
@media (max-width:820px){
  .lp-mini{grid-template-columns:1fr}
  .lp-mside{display:none}
  .lp-mmain{padding:18px 14px 20px}
  .lp-mini .x-acts .x-btn{width:100%}
  .lp-mini .x-fine{margin-top:16px}
  .lp-mini .x-fine .co{top:-24px;right:auto;left:0}
}

/* ================= V3 · Simplified app (Hoy · Plan · Familia) ================= */
.app.lx{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.lx svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.x-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:24px 14px 20px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(8px)}
.x-brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.x-nav{display:flex;flex-direction:column;gap:4px}
.x-nav button{display:flex;align-items:center;gap:11px;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:500;text-align:left;font-size:15px}
.x-nav button:hover{background:var(--panel-2);color:var(--ink)}
.x-nav button[aria-current]{background:var(--panel-2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.x-dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.x-who{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.x-person{display:flex;gap:10px;align-items:center;min-width:0}
.x-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--crit-soft);color:var(--crit)}
.x-av.cg{background:var(--signal-soft);color:var(--signal)}
.x-av.dr{background:var(--panel-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.x-person b{display:block;font-size:14px;line-height:1.25}
.x-person span{font-size:12.5px;color:var(--muted)}

.x-main{min-width:0;padding:22px 40px 48px;max-width:1040px;width:100%}
.x-top{display:flex;align-items:center;gap:10px;margin-bottom:34px;position:relative}
.x-top .sp{flex:1}
.x-mbrand{display:none}
.x-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:5px 9px;border-radius:7px;white-space:nowrap}
.x-seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.x-seg button{border:0;background:transparent;min-height:36px;min-width:40px;padding:4px 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-2)}
.x-seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.x-icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink-2);flex:none}
.x-menu{position:absolute;right:0;top:44px;z-index:25;min-width:210px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.x-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:14px;text-align:left}
.x-menu button:hover{background:var(--panel-2)}

.x-hello{color:var(--ink-2);font-size:16px;margin:0 0 6px}
.lx h1.x-h1{font-family:var(--display);font-size:clamp(32px,4.4vw,46px);line-height:1.02;letter-spacing:-.03em;margin:0 0 8px;font-weight:700}
.x-sub{color:var(--ink-2);margin:0 0 28px;font-size:16.5px}

/* The one card */
.x-now{background:var(--panel);border:1px solid var(--crit-line);border-radius:22px;padding:28px 30px 26px;box-shadow:var(--shadow),0 0 0 5px color-mix(in srgb,var(--crit-soft) 70%,transparent)}
.x-now.s-wait{border-color:var(--line);box-shadow:var(--shadow)}
.x-now.s-ok{border-color:var(--signal-line);box-shadow:var(--shadow),0 0 0 5px color-mix(in srgb,var(--signal-soft) 70%,transparent)}
.x-kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;letter-spacing:0;color:var(--crit);font-weight:650}
.x-kick i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:xlive 2s ease-out infinite}
.s-wait .x-kick{color:var(--warn)} .s-ok .x-kick{color:var(--signal)}
.s-wait .x-kick i,.s-ok .x-kick i{animation:none}
@keyframes xlive{0%{box-shadow:0 0 0 0 var(--crit-line)}70%,100%{box-shadow:0 0 0 7px transparent}}
.x-now h2{font-family:var(--display);font-size:clamp(24px,2.8vw,30px);line-height:1.1;letter-spacing:-.02em;margin:12px 0 10px;max-width:24ch;font-weight:700}
.x-now>p{margin:0;color:var(--ink-2);max-width:58ch;font-size:16.5px;line-height:1.55}
.x-why{margin-top:18px;display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line-2);font-size:15.5px;color:var(--ink-2)}
.x-why svg{color:var(--muted);margin-top:1px}
.x-why b{color:var(--ink)}
.x-acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:22px}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:13px;border:0;font-weight:600;font-size:15px;white-space:nowrap}
.x-btn.go{background:var(--crit);color:#fff;box-shadow:0 10px 24px -12px var(--crit)}
.x-btn.go:hover{filter:brightness(1.06)}
.x-btn.dark{background:var(--btn);color:var(--btn-ink)}
.x-btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.x-btn.sm{height:44px;padding:0 18px;font-size:15px}
.x-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.x-fine{font-size:14.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.x-fine svg.i{width:15px;height:15px}

/* Plan strip */
.x-sec{margin-top:40px}
.x-sech{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.x-sech h3{margin:0;font-size:17px;letter-spacing:-.01em}
.x-sech small{color:var(--muted);font-size:13.5px}
.x-link{margin-left:auto;color:var(--signal);font-weight:600;font-size:14px;background:none;border:0;display:inline-flex;align-items:center;gap:6px;padding:0}
.x-link svg.i{width:15px;height:15px}
.x-track{list-style:none;margin:0;padding:22px 24px;display:grid;grid-template-columns:repeat(var(--cols,5),1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.x-track li{position:relative;padding-right:10px}
.x-track li::before{content:"";position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--line)}
.x-track li.s-done::before{background:var(--signal)}
.x-track li:last-child::before{display:none}
.x-nd{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;flex:none}
.s-done>.x-nd,.x-nd.s-done{background:var(--signal);border-color:var(--signal);color:#fff}
.s-act>.x-nd,.x-nd.s-act{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:0 0 0 5px var(--crit-soft)}
.s-sched>.x-nd,.x-nd.s-sched{border-color:var(--signal);color:var(--signal)}
.s-wait>.x-nd,.x-nd.s-wait{border-color:var(--warn);color:var(--warn)}
.lx .x-nd svg.i{width:14px;height:14px;stroke-width:2.4}
.x-track b{display:block;margin-top:12px;font-size:15.5px;line-height:1.25}
.x-track li>span:last-child{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.x-track .s-act>span:last-child{color:var(--crit);font-weight:600}
.x-track .s-wait>span:last-child{color:var(--warn);font-weight:600}

.x-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.x-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.x-card h4{margin:0 0 4px;font-size:14px;font-family:var(--sans);color:var(--ink-2);font-weight:650}
.x-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line-2)}
.x-card h4+.x-row{border-top:0}
.x-row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);color:var(--ink-2);flex:none}
.x-row b{display:block;font-size:16px}
.x-row span{font-size:15px;color:var(--ink-2)}

details.x-hist{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0 22px}
.x-hist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 0;font-weight:600}
.x-hist summary::-webkit-details-marker{display:none}
.x-hist summary .n{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.x-hist summary svg{margin-left:auto;transition:transform .2s;color:var(--muted)}
.x-hist[open] summary svg{transform:rotate(90deg)}
.x-hist ol{list-style:none;margin:0;padding:0 0 14px}
.x-hist li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line-2);font-size:15.5px;color:var(--ink-2)}
.x-hist time{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:84px;padding-top:2px;white-space:nowrap}

/* Plan view */
.x-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.x-step{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.x-step.s-act{border-color:var(--crit-line)}
.x-step>button{width:100%;display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:14px;padding:16px 20px;border:0;background:none;border-radius:18px;text-align:left;color:inherit}
.x-step .t b{display:block;font-size:16.5px}
.x-step .t span{font-size:15px;color:var(--ink-2)}
.x-st{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.x-st.s-done,.x-st.s-sched{color:var(--signal);background:var(--signal-soft);border-color:transparent}
.x-st.s-act{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.x-st.s-wait{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.x-step .chev{color:var(--muted);transition:transform .2s}
.x-step.open .chev{transform:rotate(90deg)}
.x-step .body{display:none;padding:0 20px 20px 62px}
.x-step.open .body{display:block}
.x-step .body p{margin:0 0 14px;color:var(--ink-2);max-width:60ch;font-size:16px}
.x-check{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
.x-check li{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.x-check li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-style:normal;font-size:11px;font-weight:700}
.x-check li.y i{background:var(--signal);border-color:var(--signal);color:#fff}
.x-check li.n i{background:var(--crit);border-color:var(--crit);color:#fff}
.x-check li.n{color:var(--crit);font-weight:600}
.x-check li.w i{border-color:var(--warn)}
.x-check li.w{color:var(--warn)}
.x-check li.o{color:var(--muted)}
.x-docs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.x-doc{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;color:var(--ink)}
.x-doc em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted)}
.x-upload{margin-top:22px;display:flex;align-items:center;gap:14px;padding:18px 20px;border:1.5px dashed var(--line);border-radius:18px;color:var(--ink-2)}
.x-upload b{color:var(--ink)}
.x-upload small{display:block;font-size:13.5px;color:var(--muted)}
.x-upload label{margin-left:auto;cursor:pointer}
.x-upload input{position:absolute;width:1px;height:1px;opacity:0}

/* Familia */
.x-team{list-style:none;margin:0;padding:0}
.x-team li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line-2)}
.x-team li:first-child{border-top:0}
.x-team li b{display:block;font-size:15px}
.x-team li span{font-size:15px;color:var(--ink-2)}
.x-role{margin-left:auto;font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
.x-okno{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.x-okno ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;font-size:16px;color:var(--ink-2)}
.x-okno li{display:flex;gap:9px}
.x-okno li svg.i{width:16px;height:16px;margin-top:3px}
.x-yes svg{color:var(--signal)} .x-no svg{color:var(--crit)}
.x-danger{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line-2)}
.x-danger b{display:block}
.x-danger span{font-size:13.5px;color:var(--muted)}
.x-danger button{margin-left:auto;background:none;border:1px solid var(--crit-line);color:var(--crit);border-radius:11px;padding:9px 14px;font-weight:600;white-space:nowrap}

/* Intake */
.x-intake{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start}
.x-intake .lede{font-size:16.5px;color:var(--ink-2);margin:0 0 22px;max-width:46ch}
.x-drop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 24px;border:1.5px dashed var(--signal-line);border-radius:20px;background:var(--signal-soft);cursor:pointer;color:var(--ink-2)}
.x-drop.over{border-style:solid;border-color:var(--signal)}
.x-drop input{position:absolute;width:1px;height:1px;opacity:0}
.x-drop .x-up{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--signal)}
.x-drop b{color:var(--ink);font-size:16px}
.x-drop p{margin:0;font-size:14px}
.x-sample{margin-top:14px;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.x-sample .x-ficon{width:40px;height:48px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:6px;font:600 9px var(--mono);color:var(--muted);flex:none;background:var(--panel-2)}
.x-sample b{display:block;font-size:16px;color:var(--ink)}
.x-who:empty{display:none}
.x-sample span{font-size:13px;color:var(--muted)}
.x-sample .x-btn{margin-left:auto}
.x-note{font-size:13px;color:var(--muted);margin:12px 0 0}
.x-extract{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.x-extract li{display:none;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
@keyframes xrise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.x-extract li:first-child{border-top:0}
.x-extract li.on{display:flex;animation:xrise .3s ease both}
.x-extract li b{display:block;font-size:14.5px}
.x-extract li span{font-size:13.5px;color:var(--muted)}
.x-extract li.s-alert .x-nd{background:var(--crit);border-color:var(--crit);color:#fff}

/* Owner tags, consent, demo control */
.x-check li{flex-wrap:wrap}
.x-own{font-style:normal;margin-left:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.x-own.n{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.x-own.w{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.x-consent{display:flex !important;align-items:center;gap:6px;margin-top:4px;font-size:12.5px !important;color:var(--signal) !important}
.x-consent svg.i{width:14px;height:14px}
.x-sim{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.x-sim span{font-size:12.5px;color:var(--muted)}
.x-why.x-ok{background:var(--signal-soft);border-color:transparent;color:var(--ink)}
.x-why.x-ok svg{color:var(--signal)}

/* Primary (non-urgent) action, message toggle, undo, notifications, doc chips, preview */
.x-btn.pri{background:var(--signal);color:#fff;box-shadow:0 10px 24px -12px var(--signal)}
.x-btn.pri:hover{filter:brightness(1.06)}
.x-msg summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:15.5px;color:var(--signal)}
.x-msg summary::-webkit-details-marker{display:none}
.x-msg summary svg.i{transition:transform .2s}
.x-msg[open] summary svg.i{transform:rotate(90deg)}
.x-undo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:16px !important}
.x-undo .x-textbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15.5px}
.x-undo span{font-size:13.5px;color:var(--muted)}
.x-notify{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.x-notify svg.i{width:15px;height:15px;color:var(--signal)}
.x-cardsub{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.x-chan{display:inline-flex}
.x-chan button{min-height:40px;padding:4px 16px}
button.x-doc{cursor:pointer;font:inherit;font-size:14.5px;min-height:40px;transition:border-color .15s,background .15s}
button.x-doc:hover{border-color:var(--signal-line);background:var(--signal-soft)}
.x-paper{display:flex;flex-direction:column;gap:9px;margin:4px 0 12px;padding:22px 22px 26px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.x-paper b{color:#24212B;font-size:16px}
.x-paper span{color:#766F86;font-size:13px;margin-bottom:8px}
.x-paper i{display:block;height:8px;border-radius:4px;background:#EAE6F2;width:100%}
.x-slot{min-height:52px}

/* Drawer */
.x-scrim{position:fixed;inset:0;background:rgba(20,16,35,.38);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.x-scrim.on{opacity:1;pointer-events:auto}
.x-drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(480px,100%);background:var(--panel);color:var(--ink);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:-30px 0 60px -30px rgba(0,0,0,.35)}
.x-drawer.on{transform:none;visibility:visible;transition:transform .25s ease}
.x-dh{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line-2)}
.x-dh .x-kick{color:var(--muted)}
.x-dh h2{margin:6px 0 0;font-size:21px;letter-spacing:-.01em}
.x-dh .x-icon{margin-left:auto}
.x-db{flex:1;overflow:auto;padding:20px 24px}
.x-df{padding:16px 24px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:grid;gap:10px}
.x-df .x-btn{width:100%}
.x-df .x-fine{justify-content:center}
.x-fld{margin-bottom:16px}
.x-fld .lb{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.x-fld .v{font-size:16.5px}
.x-letter{padding:16px 18px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-size:15.5px;color:var(--ink-2);line-height:1.6}
.x-letter p{margin:0 0 10px}.x-letter p:last-child{margin:0}
.x-letter[contenteditable="true"]{outline:2px solid var(--signal-line);background:var(--panel)}
.x-textbtn{border:0;background:none;color:var(--signal);font-weight:600;padding:8px 0 0;font-size:14px}
.x-pack{list-style:none;margin:0 0 16px;padding:0;border:1px solid var(--line);border-radius:14px}
.x-pack li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2)}
.x-pack li:first-child{border-top:0}
.x-pack li b{display:block;font-size:14.5px}
.x-pack li span{font-size:13px;color:var(--muted)}
.x-pack li .ok{margin-left:auto;color:var(--signal)}
.x-slots{display:grid;gap:10px}
.x-slot{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left;color:var(--ink);width:100%}
.x-slot[aria-pressed="true"]{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.x-slot .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.x-slot[aria-pressed="true"] .rd{border:6px solid var(--signal)}
.x-slot b{display:block;font-size:15px}
.x-slot span{font-size:13px;color:var(--muted)}
.x-slot[aria-pressed="true"] b,.x-slot[aria-pressed="true"] span{color:var(--ink)}
:root:not([data-look="light"]) .x-slot[aria-pressed="true"] b,:root:not([data-look="light"]) .x-slot[aria-pressed="true"] span{color:#fff}
.x-slot em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--signal);background:var(--signal-soft);padding:2px 8px;border-radius:20px;white-space:nowrap}
.x-sent{text-align:center;padding:40px 10px}
.x-sent .big{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--signal);color:#fff}
.lx-d .x-sent .big svg.i{width:30px;height:30px;stroke-width:2.4}
.x-sent h3{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.x-sent p{margin:0 auto;color:var(--ink-2);max-width:34ch}
.x-form{display:grid;gap:14px}
.x-form label{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.x-form input,.x-form select{height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink);padding:0 12px;font-size:15px;font-weight:400}
.lx-d svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.x-toast{position:fixed;left:50%;bottom:24px;z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.x-toast.on{opacity:1;transform:translate(-50%,0)}
.x-foot{margin-top:40px;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.x-tabbar{display:none}
@media (prefers-reduced-motion:reduce){.x-drawer,.x-scrim,.x-toast,.x-extract li{transition:none}.x-kick i{animation:none}}

@media (max-width:820px){
  .app.lx{grid-template-columns:minmax(0,1fr)}
  .x-side{display:none}
  .x-main{padding:14px 16px 104px}
  .x-top{margin-bottom:22px}
  .x-mbrand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)}
  .x-now{padding:22px 20px 20px;border-radius:20px}
  .x-acts .x-btn{width:100%}
  .x-track{grid-template-columns:1fr;padding:6px 18px}
  .x-track li{display:grid;grid-template-columns:28px 1fr;column-gap:14px;padding:12px 0}
  .x-track li::before{top:40px;bottom:-12px;left:13px;right:auto;width:2px;height:auto}
  .x-track li>.x-nd{grid-column:1;grid-row:1 / span 2}
  .x-track li>b{grid-column:2;grid-row:1;margin-top:3px}
  .x-track li>span:last-child{grid-column:2;grid-row:2}
  .x-cols,.x-okno,.x-intake{grid-template-columns:1fr}
  .x-intake{gap:24px}
  .x-step>button{grid-template-columns:28px 1fr auto;padding:14px 16px}
  .x-step>button .x-st{grid-column:2;justify-self:start;margin-top:4px}
  .x-step>button .chev{grid-row:1;grid-column:3}
  .x-step .body{padding:0 16px 18px}
  .x-upload{flex-wrap:wrap}.x-upload label{margin-left:0;width:100%}.x-upload label .x-btn{width:100%}
  .x-role{display:none}

  function confirmDrawer(){
    const k = dwOpen;
    if (k === 'appeal') { const l = $('#xLetter'); if (l && editing) S.appealLetter = l.innerHTML; armUndo('denied', S.hist.length, S.pending); S.stage = 'waitAppeal'; log('h.appeal'); dwDone = true; advance('schedule', 'h.apprAppeal', 't.apprAppeal'); }
    else if (k === 'request') { const l = $('#xLetter'); if (l && editing) S.letter = l.innerHTML; armUndo('request', S.hist.length, S.pending); S.stage = 'waitClinic'; log('h.req'); dwDone = true; advance('review', 'h.notes', 't.notes', 'h.pack'); }
    else if (k === 'review') { armUndo('review', S.hist.length, S.pending); S.stage = 'waitPlan'; log('h.sent'); dwDone = true; advance('schedule', 'h.appr', 't.appr'); }

    else if (k === 'assign') { S.extra.push({ name:S.newFile, step:S.assign }); S.open[S.assign] = true; log('h.doc', { f:S.newFile }); closeDrawer(); toast('t.doc'); render(); return; }
    else if (k === 'invite') { const n = ($('#xInvName').value || '').trim(); if (!n) { $('#xInvName').focus(); return; } S.invited.push({ name:n, rel:+$('#xInvRel').value, perm:+$('#xInvPerm').value }); log('h.inv', { n }); closeDrawer(); toast('t.inv'); render(); return; }
    else if (k === 'delete') { clearTimeout(timer); closeDrawer(); S = fresh(); S.open = { mri:true }; render(); window.scrollTo(0,0); toast('dl.done'); return; }
    render(); setTimeout(() => { const b = $('#xDrawer [data-backhome]'); if (b) b.focus(); }, 30);
  }

  // ---------- Toast ----------
  let tt;
  let toastK = null;
  const paintToast = () => { const el = $('#xToast'); el.innerHTML = `${ic('i-latch').replace('class="i"','class="i" style="width:12px;height:20px"')}<span>${esc(t(toastK))}</span>`; };
  function toast(k){ toastK = k; paintToast(); const el = $('#xToast'); el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => { el.classList.remove('on'); toastK = null; }, 2800); }

  // ---------- Language + look ----------
  function setLang(l){ if (l === lang) return; lang = l; try { localStorage.setItem('latch-lang', l); } catch(_) {} if (S.steps) ensureDrafts(); render(); }
  function setLook(l, remember){
    if (l === 'light') root.dataset.look = 'light'; else delete root.dataset.look;
    if (remember) { try { localStorage.setItem('latch-theme', l); } catch(_) {} }
  }
  let look = 'light'; try { look = localStorage.getItem('latch-theme') || 'light'; } catch(_) {}
  setLook(look);

  // ---------- Menu ----------
  const menu = $('#xMenu'), menuBtn = $('#xMenuBtn');
  function toggleMenu(on){
    menu.hidden = !on; menuBtn.setAttribute('aria-expanded', String(on));
    if (on) {
      const light = root.dataset.look === 'light';
      menu.innerHTML = `<button type="button" data-xlook>${ic(light?'i-moon':'i-sun')}${t(light?'menu.dark':'menu.light')}</button><button type="button" data-xreset>${ic('i-reset')}${t('menu.reset')}</button>`;
      menu.querySelector('button').focus();
    }
  }

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const q = s => e.target.closest(s);
    let el;
    if ((el = q('[data-lang]'))) { setLang(el.dataset.lang); return; }
    if (q('#xMenuBtn')) { toggleMenu(menu.hidden); return; }
    if (!q('#xMenu') && !menu.hidden) toggleMenu(false);
    if (q('#xMenu [data-xlook]')) { setLook(root.dataset.look === 'light' ? 'dark' : 'light', true); toggleMenu(false); return; }
    if (q('#xMenu [data-xreset]')) { location.hash = 'app'; location.reload(); return; }
    if ((el = q('[data-tab]')) && q('#lx')) { if (S.stage === 'intake' || S.stage === 'extract') return; S.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
    if ((el = q('[data-act]'))) {
      const a = el.dataset.act;
      if (a === 'enter') return enterPlan();
      if (a === 'sim' && S.pending) { const pd = S.pending; S.pending = null; S.stage = pd.next; log(pd.histK); if (pd.extraLog) log(pd.extraLog); toast(pd.toastK); render(); const b = $('#xView [data-act="open"]'); if (b) b.focus(); return; }
      // Simulated denial: drop the pending approval, start drafting the appeal.
      if (a === 'deny' && S.stage === 'waitPlan') { clearTimeout(timer); S.pending = null; S.denied = true; S.stage = 'denied'; log('h.denied'); ensureDrafts(); toast('t.denied'); render(); const b = $('#xView [data-act="open"]'); if (b) b.focus(); return; }
      if (a === 'open') return openDrawer(S.stage === 'denied' ? 'appeal' : S.stage);
      if (a === 'invite' || a === 'delete') return openDrawer(a);
    }
    if (q('[data-close]')) { const home = q('[data-backhome]'); closeDrawer(); if (home && S.tab !== 'hoy') { S.tab = 'hoy'; render(); window.scrollTo(0,0); } return; }
    if (q('#xScrim')) { closeDrawer(); return; }
    if (q('[data-confirm]')) { confirmDrawer(); return; }
    if ((el = q('[data-edit]'))) { const l = $('#xLetter'); if (editing && l) S[letterKey()] = l.innerHTML; editing = !editing; renderDrawer(); if (editing) $('#xLetter').focus(); return; }
    if ((el = q('[data-undo]')) && S.undo) { const u = S.undo; S.undo = null; S.stage = u.prev; S.hist.splice(0, S.hist.length - u.histLen); S.pending = u.pending; dwDone = false; render(); renderDrawer(); toast('t.undo'); const c = $('#xDrawer [data-confirm]'); if (c) c.focus(); return; }
    if ((el = q('[data-notify]'))) { S.notify = el.dataset.notify; render(); const b = $(`[data-notify="${S.notify}"]`); if (b) b.focus(); return; }
    if ((el = q('[data-doc]'))) { S.docView = { name:el.dataset.doc, src:el.dataset.src, step:el.dataset.step }; openDrawer('doc'); return; }
    if ((el = q('[data-assign]'))) { S.assign = el.dataset.assign; renderDrawer(); const b = $(`[data-assign="${S.assign}"]`); if (b) b.focus(); return; }
    if ((el = q('[data-slot]'))) { pick = el.dataset.slot; renderDrawer(); const b = $(`[data-slot="${pick}"]`); if (b) b.focus(); return; }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!menu.hidden) { toggleMenu(false); menuBtn.focus(); return; }
    if (dwOpen) closeDrawer();
  });

  render();
})();
</script>

  });
  Object.assign(L.en, {
    'fin.signup':'See how sign-up works (Spanish mockup)', 'nav.sections':'Sections', 'nav.open':'Open menu', 'nav.close':'Close menu', 'nav.s1':'Home', 'nav.s2':'How it works', 'nav.s3':'Product', 'nav.s4':'Try it',
    'hv.k':'Review before sending', 'hv.t':'MRI authorization', 'p2.btn':'Review & send',
    'how.h':'One care plan. Four clear steps.', 'how.p':'Latch tells you what to do, one thing at a time.',
    's1.t':'Upload the visit summary', 's1.p':'Latch turns it into a plan with every order from the doctor.',
    's2.t':'Latch finds what’s missing', 's2.p':'It checks what the health plan requires and prepares what’s needed.',
    's3.t':'You approve', 's3.p':'You review every request before it goes out. Nothing is sent without your OK.',
    's4.t':'Latch follows through', 's4.p':'It waits on replies, keeps you posted and finds the appointment when everything’s ready.',
    'pr.p':'Instead of navigating the process alone, Latch shows you one thing: what to do now.',
    'pr.aria':'The Latch Today screen: the one action to take now, why it matters, approval before sending, and the care plan',
    'mn.1':'Today', 'mn.2':'Plan', 'mn.3':'Family',
    'mk.hello':'Hi, Ana', 'mk.title':'María’s plan', 'mk.k':'What to do now',
    'mk.t':'Ask Clínica Costa Norte for the visit notes', 'mk.p':'Plan Salud Coquí needs them to approve María’s MRI. Latch already drafted the request.',

    'mk.plan':'The plan', 'mk.ready':'3 of 5 on track',
    'ms.1':'Doctor visit', 'ms.1s':'Sep 18 · Done', 'ms.2':'Cardiology referral', 'ms.2s':'Visit on Oct 2', 'ms.3s':'Something’s missing',
    'ms.4':'Blood work', 'ms.4s':'Wed Sep 30', 'ms.5':'Follow-up', 'ms.5s':'After the MRI',
    'co.1':'One action', 'co.2':'The why', 'co.3':'The whole plan', 'co.4':'You approve',
    'lg.1':'What to do today, not twenty things at once.', 'lg.2':'Every step explains why it matters, in plain words.',
    'lg.3':'Where care stands, at a glance.', 'lg.4':'Nothing goes out without your OK.'
  });

  // ---------- Copy follows the app's language (the app keeps it on <html lang>) ----------
  const lang = () => root.lang === 'en' ? 'en' : 'es';
  const t = k => L[lang()][k] ?? L.es[k] ?? '';
  function applyCopy(){
    land.lang = lang();
    land.querySelectorAll('[data-l]').forEach(el => { el.textContent = t(el.dataset.l); });
    land.querySelectorAll('[data-l-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.lAria)));
    land.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang())));
    if (root.dataset.route !== 'app') document.title = t('title');
    pill.textContent = t(panes[phase].dataset.pill);
  }

  // ---------- Routing: landing (default) ⇄ #app ⇄ #ejemplo ----------
  const isApp = h => h === '#app' || h === '#ejemplo';
  function route(){
    root.dataset.route = isApp(location.hash) ? 'app' : 'landing';
    land.classList.remove('leaving');
    document.title = root.dataset.route === 'app' ? (root.lang==='en'?'Latch · Care plan':'Latch · Plan de cuidado') : t('title');
  }
  function runExample(){
    history.replaceState(null, '', '#app');            // a reload won't re-run the example
    const btn = document.getElementById('sampleAvs');   // the app's existing "Usar ejemplo"
    if (btn) btn.click();                               // no-op if the app is already past intake
  }
  function enter(example){
    const go = () => { location.hash = example ? 'ejemplo' : 'app'; };
    if (reduce()) return go();
    land.classList.add('leaving'); setTimeout(go, 200);
  }
  window.addEventListener('hashchange', () => {
    route(); window.scrollTo(0, 0);
    if (location.hash === '#ejemplo') runExample();
  });

  land.addEventListener('click', e => {
    const tg = e.target.closest('[data-enter],[data-example],[data-scroll],[data-phase]');
    if (!tg) return;
    if (tg.dataset.phase) { show(+tg.dataset.phase); restart(); return; }
    if (tg.dataset.scroll) { document.getElementById(tg.dataset.scroll).scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block:'start' }); return; }
    enter(tg.hasAttribute('data-example'));
  });

  // ---------- Nav compacts on scroll ----------
  const nav = document.getElementById('lpNav');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 16);
  window.addEventListener('scroll', onScroll, { passive:true }); onScroll();

  // ---------- Hero preview: Documentation → Review → Submission ----------
  const hv = document.getElementById('hv'), panes = hv.querySelectorAll('.hv-pane'), tabs = hv.querySelectorAll('[data-phase]');
  const pill = document.getElementById('hvPill'), track = document.getElementById('hvTrack');
  let phase = 0, timer = null, paused = false;
  function show(n){
    phase = n;
    panes.forEach((p, i) => p.classList.toggle('on', i === n));
    tabs.forEach((b, i) => { b.classList.toggle('done', i < n); b.classList.toggle('cur', i === n); b.setAttribute('aria-current', i === n ? 'step' : 'false'); });
    track.style.width = ((n + 1) / 3 * 100) + '%';
    pill.textContent = t(panes[n].dataset.pill);
    pill.className = 'pill ' + panes[n].dataset.tone;
  }
  function restart(){
    clearInterval(timer);
    if (reduce()) return;
    timer = setInterval(() => { if (!paused && root.dataset.route === 'landing' && !document.hidden) show((phase + 1) % 3); }, 3400);
  }
  hv.addEventListener('mouseenter', () => paused = true);
  hv.addEventListener('mouseleave', () => paused = false);

  new MutationObserver(applyCopy).observe(root, { attributes:true, attributeFilter:['lang'] });
  applyCopy(); route(); show(0); restart();
  if (location.hash === '#ejemplo') runExample();

  // ---------- Section nav: selected state follows the scroll ----------
  const secNav = document.getElementById('lpSections');
  const secLinks = [...secNav.querySelectorAll('a[data-scroll]')];
  const markSec = id => secLinks.forEach(a => a.setAttribute('aria-current', String(a.dataset.scroll === id)));
  secNav.addEventListener('click', e => { const a = e.target.closest('a[data-scroll]'); if (!a) return; e.preventDefault(); markSec(a.dataset.scroll); });
  const secEls = secLinks.map(a => document.getElementById(a.dataset.scroll)).filter(Boolean);
  const spy = () => {
    if (root.dataset.route !== 'landing') return;
    const line = window.innerHeight * 0.4;
    let cur = secEls[0].id;
    secEls.forEach(el => { if (el.getBoundingClientRect().top <= line) cur = el.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secEls[secEls.length-1].id;
    markSec(cur);
  };
  let spyRaf = 0;
  window.addEventListener('scroll', () => { cancelAnimationFrame(spyRaf); spyRaf = requestAnimationFrame(spy); }, { passive:true });
  window.addEventListener('resize', spy);
  spy();

  // ---------- Mobile hamburger ----------
  const lpNav = document.getElementById('lpNav'), burger = document.getElementById('lpBurger');
  const syncBurger = () => {
    const open = lpNav.classList.contains('open');
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', t(open ? 'nav.close' : 'nav.open'));
    burger.innerHTML = `<svg class="i"><use href="#${open ? 'i-x' : 'i-menu'}"/></svg>`;
  };
  const setMenu = on => { lpNav.classList.toggle('open', on); syncBurger(); };
  burger.addEventListener('click', e => { e.stopPropagation(); setMenu(!lpNav.classList.contains('open')); });
  document.getElementById('lpMenu').addEventListener('click', e => { if (e.target.closest('a[data-scroll],[data-enter]')) setMenu(false); });
  document.addEventListener('click', e => { if (lpNav.classList.contains('open') && !lpNav.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lpNav.classList.contains('open')) { setMenu(false); burger.focus(); } });
  matchMedia('(min-width: 861px)').addEventListener('change', e => { if (e.matches) setMenu(false); });
  window.addEventListener('hashchange', () => setMenu(false));
  new MutationObserver(syncBurger).observe(root, { attributes:true, attributeFilter:['lang'] });
  syncBurger();

  // ---------- Reveals: the four-step connector fills in order; callouts appear on the product ----------
  const reveal = (el, threshold) => {
    if (!('IntersectionObserver' in window) || reduce()) return el.classList.add('on');
    const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { el.classList.add('on'); io.disconnect(); } }, { threshold });
    io.observe(el);
  };
  reveal(document.getElementById('lpFlow'), .35);
  reveal(document.getElementById('lpApp'), .3);
})();
</script>
