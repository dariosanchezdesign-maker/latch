/* Dark control room is the default look; the page's own toggle switches to light. */
:root{
  color-scheme:dark;
  --bg:#000000; --bg-dot:rgba(255,255,255,.045);
  --panel:#0E0E10; --panel-2:#151518; --sunken:#08080A;
  --line:#242428; --line-2:#1A1A1D;
  --ink:#F5F5F7; --ink-2:#B9B9C1; --muted:#86868F; --faint:#4B4B52;
  --signal:#8B5CF6; --signal-soft:rgba(139,92,246,.18); --signal-line:rgba(139,92,246,.45);
  --warn:#F2B155; --warn-soft:rgba(242,177,85,.13); --warn-line:rgba(242,177,85,.42);
  --crit:#E65BBE; --crit-soft:rgba(230,91,190,.15); --crit-line:rgba(230,91,190,.5);
  --info:#7DA3FF; --info-soft:rgba(91,140,255,.16);
  --logo-purple:#8B5CF6;
  --deep:#241A45; --purple:#6D4AFF; --violet:#8B5CF6; --pink:#E65BBE; --blue:#5B8CFF; --lavender:#F2EEFF; --blush:#FCEAF7;
  --btn:#F5F5F7; --btn-ink:#000000; --go-ink:#FFFFFF; --danger-ink:#000000;
  --paper:#FCFBFE; --paper-ink:#24212B; --paper-line:#E7E2F2; --mark:rgba(109,74,255,.16);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 50px -30px rgba(0,0,0,.9);
  --glow-s:0 0 0 4px rgba(139,92,246,.18),0 0 18px rgba(139,92,246,.4);
  --glow-c:0 0 0 4px rgba(230,91,190,.18),0 0 18px rgba(230,91,190,.42);
  --glow-w:0 0 0 4px rgba(242,177,85,.14),0 0 18px rgba(242,177,85,.35);
  --sans:"Host Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Magnetik","Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Azeret Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
:root[data-look="light"]{
  color-scheme:light;
  --bg:#FCFBFE; --bg-dot:rgba(36,26,69,.05);
  --panel:#FFFFFF; --panel-2:#F9F7FE; --sunken:#F5F2FD;
  --line:#E6E0F3; --line-2:#EFEBF8;
  --ink:#24212B; --ink-2:#4B4658; --muted:#766F86; --faint:#B7B0C6;
  --signal:#6D4AFF; --signal-soft:#F2EEFF; --signal-line:rgba(109,74,255,.32);
  --warn:#B86A12; --warn-soft:rgba(184,106,18,.09); --warn-line:rgba(184,106,18,.38);
  --crit:#C93E9C; --crit-soft:#FCEAF7; --crit-line:rgba(230,91,190,.45);
  --info:#3F6FE8; --info-soft:rgba(91,140,255,.11);
  --logo-purple:#6D4AFF;
  --deep:#241A45; --purple:#6D4AFF; --violet:#8B5CF6; --pink:#E65BBE; --blue:#5B8CFF; --lavender:#F2EEFF; --blush:#FCEAF7;
  --btn:#241A45; --btn-ink:#FFFFFF; --go-ink:#FFFFFF; --danger-ink:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#24212B; --paper-line:#EAE5F4; --mark:rgba(109,74,255,.12);
  --shadow:0 1px 2px rgba(36,26,69,.05),0 12px 30px -18px rgba(36,26,69,.22);
  --glow-s:0 0 0 4px rgba(109,74,255,.12);
  --glow-c:0 0 0 4px rgba(201,62,156,.14);
  --glow-w:0 0 0 4px rgba(184,106,18,.12);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 var(--signal-line);animation:live 2s ease-out infinite;flex:none}
.live.crit{background:var(--crit)}
.live.warn{background:var(--warn)}
@keyframes live{0%{box-shadow:0 0 0 0 var(--signal-line)}70%,100%{box-shadow:0 0 0 7px transparent}}

/* ---------- Shell (unchanged) ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:24px 16px 20px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px;stroke-width:2}
.brand-name{font-family:var(--sans);font-weight:700;font-size:23px;letter-spacing:-.025em;line-height:1}
.brand{gap:9px}
.brand-logo svg{display:block;height:30px;width:auto;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.brand-logo .lg-b{stroke:var(--blue)}.brand-logo .lg-k{stroke:var(--pink)}.brand-logo .lg-p{stroke:var(--logo-purple)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .label{padding:0 10px 8px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--panel-2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--crit-soft);color:var(--crit)}
.count.ok{background:var(--signal-soft);color:var(--signal)}
.count.plain{background:var(--sunken);color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.watch{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);font-size:12.5px;color:var(--ink-2)}
.watch .live{margin-top:6px}
.watch b{display:block;color:var(--ink);font-weight:600}
.patient{display:flex;align-items:center;gap:11px;padding:0 6px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:linear-gradient(135deg,#FCEAF7,#F3C4E6);color:#86276A}
.avatar.cg{background:linear-gradient(135deg,#F2EEFF,#D8CBFF);color:#4B2DB8}
.avatar.cg2{background:linear-gradient(135deg,#E6EEFF,#BFD2FF);color:#2447A8}
.avatar.dr{background:linear-gradient(135deg,#F2EEFF,#E1D8F8);color:#241A45}
.avatar.lt{background:var(--btn);color:var(--btn-ink)}
.avatar.lt svg{width:15px;height:15px;stroke-width:2}
.avatar.sm{width:24px;height:24px;font-size:10px}
.patient b{display:block;font-size:13.5px;line-height:1.25}
.patient span{font-size:12px;color:var(--muted)}
.motto{padding:0 6px;margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.motto b{color:var(--ink);font-weight:600}

.main{min-width:0;padding:0 32px 48px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;min-width:0;white-space:nowrap}
.crumbs b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.clock{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.clock b{color:var(--ink);font-weight:600}
.seg-toggle{display:inline-flex;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--panel);gap:2px}
.seg-toggle button{height:28px;min-width:34px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em}
.seg-toggle button:hover{color:var(--ink)}
.seg-toggle button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}

/* ---------- 1 · Mission header (where am I?) ---------- */
.mh{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,440px);gap:28px;align-items:end;padding:18px 0 22px}
.m-eyebrow{display:flex;align-items:center;gap:9px}
.mh h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.4vw,46px);line-height:1;letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
.mprog{padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.mprog .top{display:flex;align-items:baseline;gap:10px}
.mprog .pct{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:1;color:var(--signal)}
.mprog .pct small{font-size:18px}
.mprog .pl{font-size:14px;color:var(--ink-2);font-weight:500}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:14px 0 12px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:linear-gradient(90deg,var(--purple),var(--pink));box-shadow:0 0 12px var(--signal-line);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.counts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.counts span{display:inline-flex;align-items:center;gap:7px}
.counts b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.counts i{width:8px;height:8px;border-radius:50%}

/* ---------- Grid + panels ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-12{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0;box-shadow:var(--shadow)}
.p-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.p-head h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.p-head .sub{font-size:12.5px;color:var(--muted)}
.p-head .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.p-body{padding:18px 20px 20px}
.sec-label{display:flex;align-items:center;gap:10px;margin:0 0 10px}
[data-views]{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(6px);opacity:.001}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.pill.ok{background:var(--signal-soft);color:var(--signal)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.wait{background:var(--sunken);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.crit::before{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:14px;transition:transform .12s,background .15s,opacity .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--btn) 85%,var(--signal))}
.btn.go{background:var(--signal);color:var(--go-ink);box-shadow:0 0 18px -4px var(--signal-line)}
.btn.danger{background:var(--crit);color:var(--danger-ink);box-shadow:0 0 22px -6px var(--crit-line)}
:root[data-look="light"] .btn.go{color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{height:48px;padding:0 22px;font-size:15px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.btn svg.i{width:16px;height:16px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-note{font-size:11.5px;color:var(--faint)}

/* ---------- 2 · Needs attention (what is wrong?) ---------- */
.att{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--crit-line);background:linear-gradient(135deg,var(--crit-soft),transparent 55%),var(--panel);box-shadow:var(--glow-c),var(--shadow);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);transition:border-color .5s,box-shadow .5s}
.att.progress{border-color:var(--warn-line);background:linear-gradient(135deg,var(--warn-soft),transparent 55%),var(--panel);box-shadow:var(--shadow)}
.att.clear{border-color:var(--line);background:var(--panel);box-shadow:var(--shadow)}
.att-main{padding:24px 26px}
.att-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.due{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--warn);white-space:nowrap}
.due svg.i{width:14px;height:14px}
.att h3{margin:0;font-size:clamp(24px,2.4vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.att .why{margin:8px 0 0;font-size:17px;color:var(--ink);font-weight:500}
.att .impact{margin:10px 0 0;color:var(--ink-2);font-size:14px;max-width:60ch}
.att .impact b{color:var(--ink);font-weight:600}
.att .actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.att-side{padding:24px 26px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px;justify-content:center}
.att.clear{grid-template-columns:1fr}
.att.clear .att-main{display:flex;align-items:center;gap:16px}
.ok-ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--signal-soft);color:var(--signal);box-shadow:var(--glow-s);flex:none}

/* stepper (shared by attention card and drawer) */
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.stp li{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding-bottom:16px}
.stp li:last-child{padding-bottom:0}
.stp li::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.stp li:last-child::before{display:none}
.stp li.done::before{background:var(--signal)}
.stp .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:600;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.stp li.done .n{background:var(--signal);border-color:var(--signal);color:var(--btn-ink)}
.stp li.cur .n{border-color:var(--signal);color:var(--signal);box-shadow:var(--glow-s)}
.stp li.run .n{border-color:var(--signal);border-top-color:transparent;animation:spin .8s linear infinite;color:transparent}
.stp .t{font-weight:600;font-size:14px;line-height:1.3;padding-top:3px}
.stp .t small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:2px}
.stp .d{font-size:13px;color:var(--ink-2);margin-top:4px}
.stp li:not(.cur):not(.done) .t{color:var(--muted)}
.stp.compact li{padding-bottom:12px}
.stp.compact .d{display:none}

/* ---------- 3 · Next actions (what do I do now?) ---------- */
.acts{list-style:none;margin:0;padding:0;counter-reset:a}
.act{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.act:first-child{border-top:0}
.act:hover{background:var(--panel-2)}
.act .no{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--sunken);border:1px solid var(--line);color:var(--ink-2)}
.act.first .no{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.act b{display:block;font-size:15px;font-weight:650;line-height:1.3}
.act .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.act .meta .who{display:inline-flex;align-items:center;gap:5px}
.act.finished{cursor:default}
.act.finished .no{background:var(--signal);border-color:var(--signal);color:var(--btn-ink)}
.act.finished b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.act.finished{animation:finish .9s ease both}
@keyframes finish{0%{background:var(--signal-soft)}100%{background:transparent}}
.act.promoted{animation:promote 1.4s ease both}
@keyframes promote{0%{background:var(--signal-soft);transform:translateY(8px);opacity:0}30%{transform:none;opacity:1}100%{background:transparent}}
.acts-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.acts-foot svg.i{width:15px;height:15px;color:var(--signal)}
.acts-empty{display:flex;align-items:center;gap:14px;padding:22px 20px}

/* ---------- 4 · Journey ---------- */
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:20px}
.mini button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 14px 0 0;border:0;background:none;text-align:left}
.mini button::after{content:"";position:absolute;top:13px;left:34px;right:8px;height:2px;background:var(--line)}
.mini button:last-child::after{display:none}
.mini button.s-done::after{background:var(--signal)}
.mini .t{font-weight:600;font-size:13.5px;line-height:1.25}
.mini .s{font-size:12px;color:var(--muted);margin-top:-4px}
.dot-st{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--faint);background:var(--panel);color:var(--muted)}
.dot-st svg.i{width:14px;height:14px;stroke-width:2.6}
.s-done .dot-st{background:var(--signal);border-color:var(--signal);color:var(--btn-ink)}
.s-blocked .dot-st{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:var(--glow-c)}
.s-progress .dot-st{background:var(--warn);border-color:var(--warn);color:var(--btn-ink);box-shadow:var(--glow-w)}
.s-active .dot-st{border-color:var(--signal);color:var(--signal);box-shadow:var(--glow-s)}
.s-upcoming .dot-st{border-style:dashed}
.mini button:hover .t{text-decoration:underline;text-underline-offset:3px}

.chain{list-style:none;margin:0;padding:22px 20px 24px}
.node{position:relative;display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:0 14px;padding-bottom:12px}
.node:last-child{padding-bottom:0}
.node .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding-top:18px;white-space:nowrap}
.node .rail{position:relative;display:flex;justify-content:center;padding-top:14px}
.node .rail::after{content:"";position:absolute;top:44px;bottom:-14px;left:13px;width:2px;background:var(--line)}
.node:last-child .rail::after{display:none}
.node.s-done .rail::after{background:var(--signal)}
.node .card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);text-align:left;transition:border-color .2s,transform .15s,background .2s}
.node .card:hover{border-color:var(--faint);transform:translateX(2px)}
.node .card b{display:block;font-size:15px;font-weight:650}
.node .card span.sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.node .card .right{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted)}
.node.s-blocked .card{border-color:var(--crit-line);background:linear-gradient(90deg,var(--crit-soft),transparent 70%),var(--panel-2);box-shadow:var(--glow-c)}
.node.s-progress .card{border-color:var(--warn-line);background:linear-gradient(90deg,var(--warn-soft),transparent 70%),var(--panel-2)}
.node.s-active .card{border-color:var(--signal-line);box-shadow:var(--glow-s)}
.node.s-upcoming .card{background:transparent;border-style:dashed}
.node.s-upcoming .card b{color:var(--ink-2)}
.node .down{position:absolute;left:calc(62px + 14px + 7px);bottom:-3px;color:var(--faint);font-size:11px;line-height:1;display:none}

/* ---------- Log ---------- */
.log{list-style:none;margin:0;padding:6px 0;max-height:560px;overflow:auto;font-size:13px}
.log li{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:10px;padding:9px 20px;align-items:start}
.log li.new{animation:logIn .6s ease both}
@keyframes logIn{from{background:var(--signal-soft);transform:translateX(-6px);opacity:0}to{background:transparent}}
.log time{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:1px;white-space:nowrap}
.log .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--faint)}
.log .ok .dot{background:var(--signal)}
.log .warn .dot{background:var(--warn)}
.log .crit .dot{background:var(--crit)}
.log .info .dot{background:var(--info)}
.log .ok,.log .warn,.log .crit,.log .info{display:contents}
.log .msg{color:var(--ink-2);line-height:1.45}
.log .msg b{color:var(--ink);font-weight:600}

/* ---------- 5 · Care team (who is helping?) ---------- */
.team{list-style:none;margin:0;padding:0}
.mem{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line-2)}
.mem:first-child{border-top:0}
.mem b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mem .r{font-size:12.5px;color:var(--muted)}
.mem .tasks{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.mem .tasks span{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--sunken);border:1px solid var(--line-2);color:var(--ink-2)}
.mem .right{margin-left:auto}
.mem.pop{animation:promote 1.4s ease both}
.team-foot{padding:14px 20px 18px;border-top:1px solid var(--line-2)}

/* ---------- Banner (what do I do now, on inner screens) ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px 12px 18px;margin-bottom:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.banner.crit{border-color:var(--crit-line);background:linear-gradient(90deg,var(--crit-soft),transparent 60%),var(--panel)}
.banner .txt{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:14px}
.banner .txt b{font-weight:650}
.banner .txt span{color:var(--ink-2)}

/* ---------- 6 · Documents ---------- */
.intake{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 20px;border:1.5px dashed var(--line);border-radius:14px;background:var(--sunken);transition:border-color .2s,background .2s;min-height:220px;cursor:pointer}
.drop.over{border-color:var(--signal);background:var(--signal-soft)}
.drop .up{width:46px;height:46px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--signal)}
.drop .up svg.i{width:22px;height:22px}
.drop b{font-size:15px}
.drop p{margin:0;color:var(--muted);font-size:13px;max-width:36ch}
.drop .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 8px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;border-radius:0;transition:background .15s}
.doc:first-child{border-top:0}
.doc:hover{background:var(--panel-2)}
.doc.fresh{animation:rise .4s ease both}
.ficon{width:36px;height:42px;border-radius:7px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--muted);position:relative}
.ficon::before{content:"";position:absolute;top:8px;left:8px;right:8px;height:2px;background:var(--line);box-shadow:0 5px 0 var(--line),0 10px 0 var(--line)}
.ficon.missing{border-style:dashed;border-color:var(--crit-line);background:transparent;color:var(--crit)}
.ficon.missing::before{display:none}
.doc b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc span.found{font-size:12.5px;color:var(--muted)}
.parsing{height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:7px;width:min(260px,100%)}
.parsing i{display:block;height:100%;background:var(--signal)}

/* ---------- Drawer + modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
:root[data-look="light"] .scrim{background:rgba(12,21,34,.28)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(460px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.7);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dw-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line-2)}
.dw-head h2{margin:6px 0 8px;font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.dw-head .icon-btn{margin-left:auto;flex:none}
.dw-body{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dw-sec h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dw-sec p{margin:0;color:var(--ink);font-size:14.5px}
.dw-sec p.muted{color:var(--ink-2)}
.owner-row{display:flex;flex-wrap:wrap;gap:8px}
.owner-row span{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:500}
.rel-doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);width:100%;text-align:left}
.rel-doc + .rel-doc{margin-top:8px}
.rel-doc b{display:block;font-size:13.5px;font-weight:600}
.rel-doc span.s{font-size:12px;color:var(--muted)}
.dw-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 22px 20px;border-top:1px solid var(--line-2)}
.dw-foot .btn.lg{flex:1 1 220px}
.success{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--warn-line);background:var(--warn-soft)}
.success.ok{border-color:var(--signal-line);background:var(--signal-soft)}
.success b{display:block;font-size:15px}
.success span{font-size:13.5px;color:var(--ink-2)}
.paper{border-radius:10px;background:var(--paper);color:var(--paper-ink);padding:18px 18px 20px;box-shadow:0 12px 30px -16px rgba(0,0,0,.6);font-size:12px}
.paper .ph{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--paper-line);font-weight:700;font-size:12.5px}
.paper .ph span{font-family:var(--mono);font-weight:500;font-size:10.5px;opacity:.7}
.paper .ln{height:6px;border-radius:3px;background:var(--paper-line);margin:7px 0}
.paper mark{display:block;margin:10px 0;padding:6px 8px;border-radius:6px;background:var(--mark);color:var(--paper-ink);font-family:var(--mono);font-size:11px}
.paper.missing{background:transparent;border:1.5px dashed var(--crit-line);box-shadow:none;color:var(--crit);text-align:center;padding:30px 18px;font-size:13px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);font-weight:500}

.modal-wrap{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);opacity:0;transform:translateY(12px) scale(.98);transition:all .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.modal.on{opacity:1;transform:none;pointer-events:auto}
.modal .m-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 6px}
.modal h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.modal .m-head .icon-btn{margin-left:auto;flex:none}
.modal form{padding:12px 22px 22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);padding:0 12px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.assign{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--sunken);transition:border-color .15s,background .15s}
.opt:has(input:checked){border-color:var(--signal-line);background:var(--signal-soft)}
.opt input{accent-color:var(--signal);width:16px;height:16px;margin:0}
.opt span{font-size:14px;font-weight:500}
.opt small{margin-left:auto;color:var(--muted);font-size:12px}
.m-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}

.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 24px;font-size:12px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg.i{color:var(--signal)}

/* ---------- Responsive ---------- */
@media (max-width:1240px){
  .span-7,.span-5{grid-column:1/-1}
  .intake{grid-template-columns:1fr}
}
@media (max-width:980px){
  .mh{grid-template-columns:1fr}
  .att{grid-template-columns:1fr}
  .att-side{border-left:0;border-top:1px solid var(--line-2)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row}
  .nav .label,.side-foot{display:none}
  .nav button{width:auto;white-space:nowrap}
  .main{padding:0 16px 40px}
  .mini{grid-template-columns:1fr;gap:14px}
  .mini button{flex-direction:row;align-items:center;gap:12px}
  .mini button::after{display:none}
  .mini .s{margin-top:0;margin-left:auto}
}
@media (max-width:560px){
  .brand-name,.hide-xs{display:none}
  .clock .zone{display:none}
  .form{grid-template-columns:1fr}
  .att-main,.att-side{padding:20px 18px}
  .act{grid-template-columns:30px minmax(0,1fr);padding:14px 16px}
  .act > .btn{grid-column:2;justify-self:start}
  .node{grid-template-columns:28px minmax(0,1fr);gap:0 12px}
  .node .when{display:none}
  .node .card .right .pill{display:none}
  .log li{grid-template-columns:82px 10px minmax(0,1fr);padding:9px 16px}
  .p-head,.p-body,.mem,.team-foot,.chain,.mini{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ================= V2 · Care Execution ================= */
.topbar .reset{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:12.5px;font-weight:600}
.topbar .reset:hover{color:var(--ink)}
.topbar .reset svg.i{width:15px;height:15px}

/* Intake (start of the demo) */
.intake-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:stretch;padding:26px 0 10px}
.intake-hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,54px);line-height:1;letter-spacing:-.02em;margin:14px 0 14px;text-wrap:balance}
.intake-hero p.lede{margin:0;color:var(--ink-2);font-size:16px;max-width:48ch}
.intake-hero p.lede b{color:var(--ink)}
.promise{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.promise span{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-2)}
.promise span b{font-family:var(--mono);font-size:11px;color:var(--signal)}
.intake-box{display:flex;flex-direction:column;gap:14px}
.intake-box .drop{min-height:250px}
.sample{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--signal-line);background:linear-gradient(90deg,var(--signal-soft),transparent 70%),var(--panel);text-align:left;width:100%}
.sample .ficon{width:44px;height:52px}
.sample b{display:block;font-size:14.5px}
.sample span{font-size:12.5px;color:var(--muted)}
.extract{list-style:none;margin:0;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.extract li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;font-size:14.5px;animation:rise .35s ease both}
.extract li .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--signal);border-top-color:transparent;animation:spin .8s linear infinite;margin-top:1px}
.extract li.ok .st{animation:none;background:var(--signal);border-color:var(--signal);color:var(--btn-ink)}
.extract li.crit .st{animation:none;background:var(--crit);border-color:var(--crit);color:#fff}
.extract li .st svg{width:11px;height:11px;stroke-width:3}
.extract li small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.extract li.crit b{color:var(--crit)}

/* Care loop band */
.loop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:16px 22px;margin-bottom:18px;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.loop-l .label{display:block}
.loop-l b{display:block;font-size:15px;font-weight:650;margin-top:4px;white-space:nowrap}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.stage{position:relative;display:flex;align-items:flex-start;gap:10px;padding-right:10px;min-width:0}
.stage .ln{flex:1;min-width:14px;height:2px;margin-top:15px;background:var(--line);border-radius:2px}
.stage:last-child .ln{display:none}
.stage.done .ln{background:var(--signal);box-shadow:0 0 10px var(--signal-line)}
.stage .ring{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--faint);background:var(--panel);color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:600}
.stage.done .ring{background:var(--signal);border-color:var(--signal);color:var(--btn-ink)}
.stage.done .ring svg{width:15px;height:15px;stroke-width:2.6}
.stage.cur .ring{border-color:var(--signal);color:var(--signal);box-shadow:var(--glow-s)}
.stage.cur .ring::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--signal);opacity:0;animation:ringping 2s ease-out infinite}
.stage.cur.crit .ring{border-color:var(--crit);color:var(--crit);box-shadow:var(--glow-c)}
.stage.cur.crit .ring::after{border-color:var(--crit)}
.stage.cur.warn .ring{border-color:var(--warn);color:var(--warn);box-shadow:var(--glow-w)}
.stage.cur.warn .ring::after{border-color:var(--warn)}
@keyframes ringping{0%{opacity:.6;transform:scale(.85)}80%,100%{opacity:0;transform:scale(1.25)}}
.stage .tx{min-width:0;flex:none;max-width:60%}
.stage .tx b{display:block;font-size:14px;font-weight:650;line-height:1.2;margin-top:6px}
.stage .tx span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.stage:not(.done):not(.cur) .tx b{color:var(--muted)}
.loop-r{text-align:right}
.loop-r .v{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--signal);line-height:1}
.loop-r .v small{font-size:13px}
.loop-r span{display:block;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}

/* "Ahora" execution card */
.now{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;transition:border-color .5s,box-shadow .5s}
.now.crit{border-color:var(--crit-line);background:linear-gradient(135deg,var(--crit-soft),transparent 55%),var(--panel);box-shadow:var(--glow-c),var(--shadow)}
.now.warn{border-color:var(--warn-line);background:linear-gradient(135deg,var(--warn-soft),transparent 55%),var(--panel)}
.now.go{border-color:var(--signal-line);background:linear-gradient(135deg,var(--signal-soft),transparent 55%),var(--panel);box-shadow:var(--glow-s),var(--shadow)}
.now-top{padding:22px 24px 0}
.now-top .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.now-top h3{margin:0;font-size:clamp(22px,2.2vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.q4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:18px 24px 0;border-radius:14px;overflow:hidden;background:var(--line-2);border:1px solid var(--line-2)}
.q4 div{background:var(--panel);padding:12px 14px}
.now.crit .q4 div,.now.warn .q4 div,.now.go .q4 div{background:color-mix(in srgb,var(--panel) 92%,transparent)}
.q4 h4{margin:0 0 4px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.q4 p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.4}
.now-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 24px 22px}
.tracking{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.tracking .spin{color:var(--warn)}

/* End state */
.endcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0}
.endcard .l{padding:26px}
.endcard .r{padding:26px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px;justify-content:center}
.endcard .big{font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.04em;color:var(--signal);line-height:1;margin:10px 0 6px}
.endcard .big small{font-size:22px}
.endcard ul{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.endcard li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.endcard li svg.i{width:16px;height:16px;color:var(--signal);stroke-width:2.4}
.nextstep{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--sunken)}
.nextstep b{display:block;font-size:17px;margin:4px 0 2px}
.nextstep span{font-size:13px;color:var(--muted)}

/* What Latch did */
.did{list-style:none;margin:0;padding:10px 20px 16px}
.did li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;animation:rise .4s ease both}
.did li svg.i{width:16px;height:16px;color:var(--signal);stroke-width:2.4}
.did li time{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.did-empty{padding:16px 20px 20px;font-size:13px;color:var(--muted)}
.did-count{font-family:var(--mono);font-size:12px;color:var(--signal)}

/* Executable journey */
.xj{list-style:none;margin:0;padding:18px 20px 22px}
.xs{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 14px;padding-bottom:12px}
.xs:last-child{padding-bottom:0}
.xs > .dot-st{margin-top:12px}
.xs::before{content:"";position:absolute;left:13px;top:42px;bottom:-2px;width:2px;background:var(--line)}
.xs:last-child::before{display:none}
.xs.s-done::before{background:var(--signal)}
.xs .box{border-radius:14px;border:1px solid var(--line);background:var(--panel-2);overflow:hidden}
.xs .hd{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.xs .hd b{display:block;font-size:15px;font-weight:650}
.xs .hd span.sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.xs .hd .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.xs .hd .right svg.i{transition:transform .2s}
.xs.open .hd .right svg.i{transform:rotate(90deg)}
.xs.s-blocked .box{border-color:var(--crit-line);box-shadow:var(--glow-c)}
.xs.s-progress .box{border-color:var(--warn-line)}
.xs.s-active .box{border-color:var(--signal-line);box-shadow:var(--glow-s)}
.xs.s-upcoming .box{background:transparent;border-style:dashed}
.xs.s-upcoming .hd b{color:var(--ink-2)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0;padding:4px 14px 14px}
.fields div{min-width:0}
.fields dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.fields dd{margin:0;font-size:13px;color:var(--ink)}
.fields dd.crit{color:var(--crit);font-weight:600}
.fields dd.warn{color:var(--warn);font-weight:600}
.xs .cta{padding:0 14px 14px}
.subs{list-style:none;margin:2px 14px 14px;padding:0;border-top:1px solid var(--line-2)}
.subs .xs{padding-top:12px;padding-bottom:0}
.subs .xs::before{top:54px;bottom:-14px}
.subs .xs:last-child::before{display:none}
.subs .xs > .dot-st{width:24px;height:24px;margin-top:10px}
.subs .xs{grid-template-columns:24px minmax(0,1fr)}
.subs .xs::before{left:11px}
.subs .xs .box{background:var(--panel)}

/* Notifications */
.notes{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100% - 32px))}
.note{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:14px 14px 14px 14px;border-radius:16px;border:1px solid var(--signal-line);background:var(--panel);box-shadow:0 24px 60px -24px rgba(0,0,0,.8),var(--glow-s);animation:noteIn .45s cubic-bezier(.2,.8,.2,1) both}
.note.out{animation:noteOut .3s ease both}
@keyframes noteIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes noteOut{to{opacity:0;transform:translateX(30px)}}
.note .ico{width:34px;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center}
.note .ico svg{width:17px;height:17px;stroke-width:2}
.note .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.note b{display:block;font-size:14.5px;margin-top:2px}
.note p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.note p.nx{color:var(--ink);font-weight:500}
.note .x{align-self:start;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);display:grid;place-items:center}
.note .x svg{width:14px;height:14px}
.note .go-row{grid-column:2/-1;margin-top:8px}

/* Drawer extras */
.dw-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dw-steps span{display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dw-steps span::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.dw-steps span.done::before{background:var(--signal)}
.dw-steps span.cur{color:var(--ink)}
.dw-steps span.cur::before{background:var(--signal);box-shadow:0 0 10px var(--signal-line);opacity:.55}
.missing-box{display:flex;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--crit-line);background:var(--crit-soft)}
.missing-box svg.i{color:var(--crit);margin-top:2px}
.missing-box b{display:block}
.missing-box span{font-size:13.5px;color:var(--ink-2)}
.quote{margin:0;padding:12px 14px;border-left:3px solid var(--signal);background:var(--sunken);border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.letter{border-radius:12px;background:var(--paper);color:var(--paper-ink);box-shadow:0 18px 40px -20px rgba(0,0,0,.7);overflow:hidden;font-size:12.5px}
.letter .lh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:rgba(0,0,0,.04);border-bottom:1px solid var(--paper-line)}
.letter .lh b{font-size:13.5px}
.letter .lh span{font-family:var(--mono);font-size:10px;opacity:.7}
.letter dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;padding:12px 16px;border-bottom:1px solid var(--paper-line)}
.letter dt{opacity:.6}
.letter dd{margin:0;font-weight:600}
.letter .lb{padding:12px 16px 16px;line-height:1.55}
.letter textarea{width:100%;min-height:130px;border:1px dashed #9aa3ad;border-radius:8px;background:rgba(255,255,255,.6);padding:8px;font:inherit;color:inherit;resize:vertical}
.letter .sig{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:10.5px;opacity:.75}
.sent-state{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--warn-line);background:var(--warn-soft)}
.sent-state b{display:block}
.sent-state span{font-size:13px;color:var(--ink-2)}
.packet{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.packet li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--sunken);font-size:14px;font-weight:500}
.packet li svg.i{width:16px;height:16px;color:var(--signal);stroke-width:2.4}
.packet li span{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.prov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--sunken)}
.prov + .prov{margin-top:10px}
.prov b{font-size:15px}
.prov .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.prov .meta .ok{color:var(--signal);font-weight:600}
.prov .when{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.prov .btn{grid-row:1/span 3;grid-column:2}
.prov.best{border-color:var(--signal-line)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;align-items:center;gap:10px;font-size:14px}
.checks li svg.i{width:16px;height:16px;color:var(--signal);stroke-width:2.4}
.bullets{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ask{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--sunken)}
.ask b{display:block;font-size:16px;margin-bottom:10px}
.ask .row{display:flex;flex-wrap:wrap;gap:10px}

@media (max-width:1240px){
  .intake-hero{grid-template-columns:1fr}
}
@media (max-width:980px){
  .loop{grid-template-columns:1fr}
  .loop-r{text-align:left}
  .endcard{grid-template-columns:1fr}
  .endcard .r{border-left:0;border-top:1px solid var(--line-2)}
}
@media (max-width:700px){
  .stages{grid-template-columns:1fr 1fr;gap:14px 0}
  .stage .ln{display:none}
  .stage .tx{max-width:none}
  .q4{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .endcard ul{grid-template-columns:1fr}
  .topbar .reset span{display:none}
  .crumbs{display:none}
}

/* ================= V2.1 · Sandbox, consent, audit, boundaries ================= */
.sandbox{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;border:1px dashed var(--warn-line);background:var(--warn-soft);color:var(--warn);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sandbox i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.sb-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;border:1px dashed var(--warn-line);color:var(--warn);font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.disc{display:flex;gap:8px;align-items:flex-start;margin:12px 4px 0;font-size:12px;line-height:1.45;color:var(--muted)}
.disc svg.i{width:14px;height:14px;margin-top:1px;flex:none}
.dw-foot .disc{flex-basis:100%;margin:2px 0 0}
.ai-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--info) 45%,transparent);background:var(--info-soft);font-size:13.5px;color:var(--ink-2)}
.ai-note svg.i{color:var(--info);margin-top:1px}
.ai-note b{display:block;color:var(--ink)}
.cf{display:flex;flex-direction:column;gap:14px}
.cf h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.cf-to{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);font-size:14px}
.cf-to span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.share-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.share-list li{display:flex;align-items:center;gap:10px;font-size:14px}
.share-list li svg.i{width:16px;height:16px;stroke-width:2.4;flex:none}
.share-list.yes svg.i{color:var(--signal)}
.share-list.no li{color:var(--muted)}
.share-list.no svg.i{color:var(--crit)}
.cf-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.impact{padding:0;overflow:hidden}
.impact-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
.impact-grid div{padding:18px 20px;border-left:1px solid var(--line-2)}
.impact-grid div:first-child{border-left:0}
.impact-grid b{display:block;font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:1;color:var(--signal)}
.impact-grid span{display:block;margin-top:6px;font-size:13px;color:var(--ink-2)}
.impact-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px;font-weight:600}
.impact-foot small{font-weight:400;font-size:12px;color:var(--muted)}
.pv-block{padding:16px 20px;border-top:1px solid var(--line-2)}
.pv-block:first-child{border-top:0}
.pv-block h3{margin:0 0 10px;font-size:14px;font-weight:650}
.pv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pv-list li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink-2)}
.pv-list li b{color:var(--ink);font-weight:600}
.pv-list li .avatar{margin-top:-2px}
.pv-list li svg.i{width:16px;height:16px;color:var(--signal);margin-top:2px}
.pv-list .meta{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.danger-zone{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:0 20px 20px;padding:14px 16px;border-radius:14px;border:1px solid var(--crit-line);background:var(--crit-soft)}
.danger-zone div{flex:1 1 220px}
.danger-zone b{display:block}
.danger-zone span{font-size:13px;color:var(--ink-2)}
.btn.outline-crit{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.outline-crit:hover{background:var(--crit-soft)}
.bounds{display:grid;grid-template-columns:1fr;gap:0}
.bounds .col{padding:16px 20px;border-top:1px solid var(--line-2)}
.bounds .col:first-child{border-top:0}
.bounds h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:650}
.bounds ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bounds li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.bounds li svg.i{width:15px;height:15px;stroke-width:2.6;flex:none}
.bounds .ok li svg.i{color:var(--signal)}
.bounds .no li{color:var(--ink-2)}
.bounds .no li svg.i{color:var(--crit)}
.audit{width:100%;border-collapse:collapse;font-size:13px}
.audit th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line-2)}
.audit td{padding:9px 20px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.audit td:first-child{font-family:var(--mono);font-size:11.5px;white-space:nowrap;color:var(--muted)}
.audit td b{color:var(--ink);font-weight:600}
.audit tr:last-child td{border-bottom:0}
.who{display:inline-flex;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line-2)}
.who.user{background:var(--info-soft);color:var(--info);border-color:transparent}
.who.latch{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.audit-wrap{max-height:460px;overflow:auto}
.conn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px 8px}
.conn div{padding:12px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--sunken)}
.conn b{display:block;font-size:13.5px}
.conn span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.conn em{display:inline-block;margin-top:8px;font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--warn)}
.conn-note{padding:4px 20px 18px;font-size:12.5px;color:var(--muted)}
.side-del{align-self:flex-start;margin:0 6px;padding:0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.side-del:hover{color:var(--crit)}
@media (max-width:480px){
  .topbar .clock{display:none}
  .topbar{gap:8px}
}
@media (max-width:1100px){
  .sandbox .long,.crumbs .hide-xs{display:none}
  .topbar .crumbs{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:700px){
  .dw-steps span{font-size:9px;letter-spacing:.04em}
  .impact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .impact-grid div:nth-child(3){border-left:0}
  .impact-grid div:nth-child(n+3){border-top:1px solid var(--line-2)}
  .conn{grid-template-columns:1fr}
  .sandbox .long{display:none}
  .audit th,.audit td{padding-left:14px;padding-right:14px}
}
/* The brand name keeps its case inside all-caps labels (see keepBrandCase) */
.nc{text-transform:none}

/* ================= Mobile hamburger menu (≤860px) ================= */
.menu-btn{display:none}
.nav-extra{display:none}
@media (max-width:860px){
  .side{position:relative;z-index:40;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;overflow:visible;padding:10px 16px}
  .side .brand-name{display:block}
  .menu-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .menu-btn svg.i{width:20px;height:20px}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;padding:12px 16px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 24px 40px -24px rgba(0,0,0,.35)}
  .side.open .nav{display:flex;animation:rise .25s ease both}
  .nav .label{display:block}
  .nav button{width:100%;white-space:normal;padding:12px}
  .nav-extra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line-2)}
  .nav-extra .menu-reset{flex-basis:100%;height:44px;justify-content:center}
  .nav-extra .seg-toggle button{height:34px;min-width:44px}
  .nav-extra .look-toggle{height:40px;width:auto;padding:0 14px}
  .topbar .seg-toggle,.topbar #lookBtn,.topbar #resetBtn{display:none}
}

/* ================= Landing (before the app) · reuses the app's tokens and components ================= */
html[data-route="landing"] .app,
html[data-route="landing"] .notes{display:none!important}
html[data-route="app"] #landing{display:none!important}
a.brand{color:inherit;text-decoration:none}

/* The landing is always light (official palette). It only applies while the landing route is showing. */
:root[data-route="landing"]{
  color-scheme:light;
  --bg:#FCFBFE; --bg-dot:rgba(36,26,69,.05);
  --panel:#FFFFFF; --panel-2:#F9F7FE; --sunken:#F5F2FD;
  --line:#E6E0F3; --line-2:#EFEBF8;
  --ink:#24212B; --ink-2:#4B4658; --muted:#766F86; --faint:#B7B0C6;
  --signal:#6D4AFF; --signal-soft:#F2EEFF; --signal-line:rgba(109,74,255,.32);
  --warn:#B86A12; --warn-soft:rgba(184,106,18,.09); --warn-line:rgba(184,106,18,.38);
  --crit:#C93E9C; --crit-soft:#FCEAF7; --crit-line:rgba(230,91,190,.45);
  --info:#3F6FE8; --info-soft:rgba(91,140,255,.11);
  --logo-purple:#6D4AFF;
  --deep:#241A45; --purple:#6D4AFF; --violet:#8B5CF6; --pink:#E65BBE; --blue:#5B8CFF; --lavender:#F2EEFF; --blush:#FCEAF7;
  --btn:#241A45; --btn-ink:#FFFFFF; --go-ink:#FFFFFF; --danger-ink:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#24212B; --paper-line:#EAE5F4; --mark:rgba(109,74,255,.12);
  --shadow:0 1px 2px rgba(36,26,69,.05),0 12px 30px -18px rgba(36,26,69,.22);
  --glow-s:0 0 0 4px rgba(109,74,255,.12);
  --glow-c:0 0 0 4px rgba(201,62,156,.14);
  --glow-w:0 0 0 4px rgba(184,106,18,.12);
  --grad:linear-gradient(90deg,#6D4AFF 0%,#E65BBE 55%,#5B8CFF 100%);
  --grad-v:linear-gradient(180deg,#6D4AFF 0%,#E65BBE 55%,#5B8CFF 100%);
}
